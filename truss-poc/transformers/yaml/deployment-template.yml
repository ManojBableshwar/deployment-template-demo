# Deployment Template for Truss-based model server on AzureML
# ─────────────────────────────────────────────────────────────────────────────
# This deployment template defines how the Truss model server should be
# deployed on AzureML managed online endpoints.
#
# Key differences from the vLLM deployment template:
#   - scoring_port: 5001 (AzureML probes this port; Truss listens here)
#   - scoring_path: / (Truss liveness returns 200 at root)
#   - environment_variables: Truss-specific (INFERENCE_SERVER_PORT, MODEL_WEIGHTS_PATH)
#   - Predict endpoint: POST /v1/models/model:predict (Truss native)
#     Also available: POST /v1/chat/completions (OpenAI-compatible)
# ─────────────────────────────────────────────────────────────────────────────
$schema: https://azuremlschemas.azureedge.net/latest/deploymentTemplate.schema.json
name: truss-qwen35-08b-tp1
version: "2"
description: "Truss deployment template for Qwen/Qwen3.5-0.8B"
deployment_template_type: managed
environment: azureml://registries/mabables-reg-feb26/environments/truss-qwen35-server/versions/13
default_instance_type: Standard_NC24ads_A100_v4
allowed_instance_types: "Standard_NC24ads_A100_v4 Standard_NC40ads_H100_v5 Standard_NC48ads_A100_v4 Standard_NC80adis_H100_v5"
instance_count: 1
scoring_port: 5001
scoring_path: /
model_mount_path: /opt/ml/model
environment_variables:
  INFERENCE_SERVER_PORT: "5001"
  MODEL_WEIGHTS_PATH: "/app/model-weights"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  PYTHONUNBUFFERED: "1"
request_settings:
  request_timeout_ms: 90000
  max_concurrent_requests_per_instance: 50
liveness_probe:
  initial_delay: 600
  period: 10
  timeout: 10
  success_threshold: 1
  scheme: http
  method: GET
  path: /
  port: 5001
readiness_probe:
  initial_delay: 600
  period: 10
  timeout: 10
  success_threshold: 1
  scheme: http
  method: GET
  path: /v1/models/model
  port: 5001
