# TEMP deployment YAML — workspace environment + inline params.
# Used to verify the vLLM docker_server + MOUNTED weights path when the registry
# DT flow is unavailable (large vllm image failed the registry ACR build).
# The canonical artifact is yaml/deployment.yml (DT-inheritance). See docs/.
$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: truss-vllm-dep
endpoint_name: truss-vllm-qwen35-a100
model: azureml://registries/<your-registry>/models/truss-vllm-qwen35/versions/1
environment: azureml:truss-vllm-server:1
instance_type: Standard_NC24ads_A100_v4
instance_count: 1
environment_variables:
  VLLM_TENSOR_PARALLEL_SIZE: "1"
  VLLM_GPU_MEMORY_UTILIZATION: "0.9"
  VLLM_MAX_MODEL_LEN: "8192"
  VLLM_MAX_NUM_SEQS: "256"
  VLLM_SERVED_MODEL_NAME: "model"
  PYTHONUNBUFFERED: "1"
request_settings:
  request_timeout_ms: 90000
  max_concurrent_requests_per_instance: 256
liveness_probe:
  initial_delay: 900
  period: 15
  timeout: 10
  success_threshold: 1
readiness_probe:
  initial_delay: 900
  period: 15
  timeout: 10
  success_threshold: 1
