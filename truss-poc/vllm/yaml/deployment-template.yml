# Deployment Template for Truss docker_server + vLLM on AzureML
# ─────────────────────────────────────────────────────────────────────────────
# Backend: Truss `docker_server` wrapping the official vLLM OpenAI server.
#
# Key differences from the TRANSFORMERS deployment template:
#   - Same scoring_port: 5001 (AzureML probes this; nginx patched to listen here)
#   - environment_variables: vLLM tuning (VLLM_*), consumed by vllm-launch.sh
#     (vs transformers: INFERENCE_SERVER_PORT / MODEL_WEIGHTS_PATH)
#   - Weights are MOUNTED from the model (model_mount_path=/opt/ml/model),
#     NOT baked into the image → no HF_HUB_OFFLINE weight-bake needed
#   - Predict endpoint: POST /v1/models/model:predict (Truss nginx → vLLM
#     /v1/chat/completions). /v1/chat/completions also works directly (passthrough).
# ─────────────────────────────────────────────────────────────────────────────
$schema: https://azuremlschemas.azureedge.net/latest/deploymentTemplate.schema.json
name: truss-vllm-qwen35-tp1
version: "1"
description: "Truss+vLLM deployment template for Qwen/Qwen3.5-0.8B (mounted weights)"
deployment_template_type: managed
environment: azureml://registries/<your-registry>/environments/truss-vllm-server/versions/2
default_instance_type: Standard_NC24ads_A100_v4
allowed_instance_types: "Standard_NC24ads_A100_v4 Standard_NC40ads_H100_v5 Standard_NC48ads_A100_v4 Standard_NC80adis_H100_v5"
instance_count: 1
scoring_port: 5001
scoring_path: /
model_mount_path: /opt/ml/model
environment_variables:
  VLLM_TENSOR_PARALLEL_SIZE: "1"
  VLLM_GPU_MEMORY_UTILIZATION: "0.9"
  VLLM_MAX_MODEL_LEN: "8192"
  VLLM_MAX_NUM_SEQS: "256"
  VLLM_SERVED_MODEL_NAME: "model"
  PYTHONUNBUFFERED: "1"
request_settings:
  request_timeout_ms: 90000
  max_concurrent_requests_per_instance: 256
liveness_probe:
  initial_delay: 600
  period: 10
  timeout: 10
  success_threshold: 1
  scheme: http
  method: GET
  path: /
  port: 5001
readiness_probe:
  initial_delay: 600
  period: 10
  timeout: 10
  success_threshold: 1
  scheme: http
  method: GET
  path: /v1/models/model
  port: 5001
