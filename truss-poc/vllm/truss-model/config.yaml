# Truss configuration for Qwen/Qwen3.5-0.8B using the vLLM backend.
# ─────────────────────────────────────────────────────────────────────────────
# This uses Truss's `docker_server` backend (NOT the default TrussServer, and
# NOT the Baseten-coupled `trt_llm`/Briton backend). `docker_server` wraps an
# existing OpenAI-compatible HTTP server — here, the official vLLM image that the
# repo already uses (vllm/vllm-openai:latest).
#
# Truss generates a container that runs:
#   - vLLM OpenAI server on `server_port` (8000)
#   - nginx reverse proxy on 8080 (UNUSED on AzureML — AzureML's inference router
#     talks directly to vLLM on :8000, the port this config declares)
#   - supervisord managing both processes
#
# Weights are MOUNTED at runtime from the AzureML model (model_mount_path=/opt/ml/model),
# NOT baked into the image. The inline start_command below points vLLM at that mount.
# ─────────────────────────────────────────────────────────────────────────────
model_name: qwen3-5-0-8b-vllm
python_version: py311

resources:
  accelerator: A100
  use_gpu: true

# docker_server backend — wrap the vLLM OpenAI server.
docker_server:
  # Inline launch (Baseten-idiomatic): the package declares its own start command
  # here, so NOTHING extra is COPY'd into the image → Truss's generated Dockerfile
  # is used UNMODIFIED (zero-edit). /opt/ml/model is the AzureML mount
  # (model_mount_path in the DT); config.json sits at its root.
  start_command: vllm serve /opt/ml/model --served-model-name model --host 0.0.0.0 --port 8000 --tensor-parallel-size 1 --gpu-memory-utilization 0.9 --max-model-len 8192 --max-num-seqs 256
  server_port: 8000
  # Truss maps these to its native routes; all other paths pass through to vLLM,
  # so /v1/chat/completions and /v1/completions work directly.
  predict_endpoint: /v1/chat/completions
  readiness_endpoint: /health
  liveness_endpoint: /health

# Base image = the same vLLM image the repo references.
base_image:
  image: vllm/vllm-openai:latest

# vLLM tuning is passed via environment variables (set by the deployment template),
# consumed by vllm-launch.sh — mirrors the repo's vllm-run.sh.
environment_variables:
  VLLM_TENSOR_PARALLEL_SIZE: "1"
  VLLM_GPU_MEMORY_UTILIZATION: "0.9"
  VLLM_MAX_MODEL_LEN: "8192"
  VLLM_MAX_NUM_SEQS: "256"
  VLLM_SERVED_MODEL_NAME: "model"
