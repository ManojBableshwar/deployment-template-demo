# Truss package descriptor (the ONLY file that declares serving behavior).
# Backend: docker_server wrapping the official vLLM OpenAI image.
# Consumed by Truss (`truss image build-context`), NOT by `az`.
model_name: qwen3-5-0-8b-vllm
python_version: py311

resources:
  accelerator: A100
  use_gpu: true

docker_server:
  # Inline launch => nothing extra is COPY'd in => Truss's Dockerfile stays UNMODIFIED.
  # /opt/ml/model is the mounted-weights path (matches deployment-template.yml model_mount_path).
  start_command: vllm serve /opt/ml/model --served-model-name model --host 0.0.0.0 --port 8000 --tensor-parallel-size 1 --gpu-memory-utilization 0.9 --max-model-len 8192 --max-num-seqs 256
  server_port: 8000
  predict_endpoint: /v1/chat/completions
  readiness_endpoint: /health
  liveness_endpoint: /health

base_image:
  image: vllm/vllm-openai:latest

environment_variables:
  VLLM_TENSOR_PARALLEL_SIZE: "1"
  VLLM_GPU_MEMORY_UTILIZATION: "0.9"
  VLLM_MAX_MODEL_LEN: "8192"
  VLLM_MAX_NUM_SEQS: "256"
  VLLM_SERVED_MODEL_NAME: "model"
