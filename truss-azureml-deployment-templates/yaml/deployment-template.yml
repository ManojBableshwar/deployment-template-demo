# AzureML Deployment Template (registry asset) — the serving contract.
# MIRRORS config.yaml: scoring_port=server_port, scoring_path=predict_endpoint,
# probes=/health, model_mount_path=/opt/ml/model. Keep these in sync with config.yaml.
$schema: https://azuremlschemas.azureedge.net/latest/deploymentTemplate.schema.json
name: truss-vllm-qwen35-tp1
version: "1"
description: "Truss + vLLM (Qwen3.5-0.8B)"
deployment_template_type: managed
environment: azureml://registries/<your-registry>/environments/truss-vllm-server/versions/1
default_instance_type: Standard_NC24ads_A100_v4
allowed_instance_types:
  - Standard_NC24ads_A100_v4
instance_count: 1
scoring_port: 8000
scoring_path: /v1/chat/completions
model_mount_path: /opt/ml/model
environment_variables:
  PYTHONUNBUFFERED: "1"
request_settings:
  request_timeout_ms: 90000
  max_concurrent_requests_per_instance: 256
liveness_probe:
  initial_delay: 600
  period: 10
  timeout: 10
  success_threshold: 1
  scheme: http
  method: GET
  path: /health
  port: 8000
readiness_probe:
  initial_delay: 600
  period: 10
  timeout: 10
  success_threshold: 1
  scheme: http
  method: GET
  path: /health
  port: 8000
